# ============================================================================
# VISU – Configuration générale de l'interface utilisateur
# ============================================================================

# Titre affiché dans la barre de titre de la fenêtre principale.
# Exemple : visu.ui.title=VISU
visu.ui.title=VISU

# Chemin du fichier CSS appliqué à l'interface (classpath).
# Exemple : visu.ui.stylesheet=/css/style.css
visu.ui.stylesheet=/css/style.css

# Largeur de la fenêtre principale en pixels.
# Exemple : visu.ui.width=1400
visu.ui.width=1400

# Hauteur de la fenêtre principale en pixels.
# Exemple : visu.ui.height=1024
visu.ui.height=1024

# Échelle minimale du zoom (0.1 = 10% de la taille originale).
# Exemple : visu.ui.zoom-min-scale=0.1
visu.ui.zoom-min-scale=0.1

# Échelle maximale du zoom (10.0 = 1000% de la taille originale).
# Exemple : visu.ui.zoom-max-scale=10.0
visu.ui.zoom-max-scale=10.0

# Sensibilité de la molette : multiplie le delta pour obtenir le facteur de zoom.
# Plus la valeur est élevée, plus le zoom est réactif.
# Exemple : visu.ui.zoom-sensitivity=0.001
visu.ui.zoom-sensitivity=0.001

# ============================================================================
# VISU – Configuration du moteur de layout (force-directed graph)
# ============================================================================

# Coefficient d'amortissement appliqué à la vitesse des nœuds à chaque tick.
# Une valeur proche de 1 = mouvement fluide et prolongé ; proche de 0 = mouvement stoppé rapidement.
# Exemple : visu.engine.layout.damping=0.9
visu.engine.layout.damping=0.9

# Force de répulsion entre les nœuds (loi en 1/d²). Plus la valeur est élevée, plus les nœuds se repoussent.
# Exemple : visu.engine.forces.repulsion.strength=50000.0
visu.engine.forces.repulsion.strength=50000.0

# Distance minimale utilisée dans le calcul de répulsion pour éviter une division par zéro et les instabilités.
# Exemple : visu.engine.forces.repulsion.min-distance=20.0
visu.engine.forces.repulsion.min-distance=20.0

# Force d'attraction entre deux nœuds reliés par un edge (analogie : constante de raideur d'un ressort).
# Plus la valeur est élevée, plus les nœuds liés se rapprochent rapidement.
# Exemple : visu.engine.forces.attraction.strength=0.05
visu.engine.forces.attraction.strength=0.05

# Distance idéale (longueur au repos) entre deux nœuds reliés par un edge.
# Le moteur tente de rapprocher ou d'éloigner les nœuds pour atteindre cette distance.
# Exemple : visu.engine.forces.attraction.rest-length=300.0
visu.engine.forces.attraction.rest-length=300.0

# Force de gravité attirant les nœuds vers le centre du graphe.
# Plus la valeur est élevée, plus les nœuds éloignés sont ramenés vers le centre.
# Exemple : visu.engine.forces.gravity.strength=0.001
visu.engine.forces.gravity.strength=0.001
